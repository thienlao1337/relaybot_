services:
  - type: web
    name: portfolio-telegram-bot
    env: docker
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: RUN_MODE
        value: webhook
      - key: WEBHOOK_HOST
        sync: false   # set this to your Render URL AFTER first deploy, e.g. https://portfolio-telegram-bot.onrender.com
      - key: DB_PATH
        value: /app/bot.db
      - key: GEMINI_API_KEY
        sync: false   # optional - enables the AI assistant via Gemini (has a free tier, checked first)
      - key: ANTHROPIC_API_KEY
        sync: false   # optional - enables the AI assistant via Claude (used if GEMINI_API_KEY is not set)
      - key: OPENAI_API_KEY
        sync: false   # optional - enables the AI assistant via OpenAI (used if neither of the above is set)
      - key: STARS_PRICE
        value: "1"
      - key: DATABASE_URL
        sync: false   # optional - point this at a managed Postgres to move off SQLite, see README
      - key: PRICE_WATCH_ENABLED
        value: "true"  # background currency-alert polling; keeps the free-tier instance from sleeping
